# Поля формы параметров объекта: что пользователь может поменять руками.
#
# Штата здесь нет. Численность и оклады вводятся строками на том же шаге, из справочника
# config/roles.yaml: одну роль можно добавить несколько раз, а поле формы этого не умеет.
#
# path      путь к значению в config/model.yaml, по нему же правка уходит в расчет
# label     как поле называется на экране
# unit      единица измерения, показываем рядом с полем
# min, max  границы из отраслевого датасета, за ними предупреждаем (ТЗ, п. 3.2.4)
# hint      подсказка и пример
# src       откуда границы
# key       главное поле: стоит наверху шага крупным числом, остальные убраны в список ниже.
#           Главные это те, что двигают расчет: размер объекта, режим работы и объем каждой задачи
# yes_no    выбор да или нет: на экране кнопки "Да" и "Нет", в данных и в файле 1 и 0
# ours      значение берем на себя, а не спрашиваем у клиента. Клиент не знает, какая доля
#           перевозок посильна роботам, сколько дежурных нужно в робозоне и на сколько вырастут
#           зарплаты. Такие поля на шаге параметров не показываем: они появляются в экономике
#           списком «что мы приняли за вас», и там их можно поправить, если клиент не согласен
#
# robot     поля выбранного робота: путь с {robot}, вместо него встает номер робота в модели.
#           Их берем на себя (цена из каталога, обслуживание и срок службы с источниками), поэтому все они
#           в допущениях на шаге экономики. relative: границы min и max это доли от значения по умолчанию:
#           у каждого робота своя цена, общий диапазон на всех был бы бессмысленным
#
# Диапазоны для склада взяты из Отраслевой датасет по складам, лист «Склад», колонки «Диапазон (min)» и «Диапазон (max)».
# Где в датасете диапазона нет, границы наши и это написано в src.

warehouse:
  - path: facilities.warehouse.schedule.shifts
    key: true
    label: "Смен в сутки"
    unit: "смен"
    min: 1
    max: 3
    hint: "Стандартно 2 смены по 11-12 часов"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.schedule.shift_hours
    key: true
    label: "Продолжительность смены"
    unit: "ч"
    min: 10
    max: 11
    hint: "С учетом перерывов на обед и технических пауз"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.schedule.days_per_year
    label: "Рабочих дней в году"
    unit: "дн"
    min: 250
    max: 365
    hint: "365 если склад работает без выходных"
    src: "Датасет дает только 365, нижнюю границу поставили сами: склад с выходными"
  - path: facilities.warehouse.peak_factor
    ours: true
    label: "Пиковый коэффициент нагрузки"
    unit: ""
    min: 1.2
    max: 2.5
    hint: "Отношение максимальной часовой нагрузки к средней, у e-com доходит до 2,5"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.slotted_by_turnover
    yes_no: true
    label: "Товар разложен по ходовости"
    unit: "1 да, 0 нет"
    min: 0
    max: 1
    hint: "Ходовое стоит ближе к воротам: роботы чаще ездят недалеко, и их нужно меньше. Если не знаете, оставьте \"Нет\""
    src: "Выбор клиента, границы это да и нет"
  - path: facilities.warehouse.active_area_m2
    key: true
    label: "Площадь зоны работы роботов"
    unit: "м2"
    min: 5000
    max: 50000
    hint: "Часть склада, по которой ездят роботы: стеллажи в работе, проезды, зоны у ворот. Обычно около половины всего склада"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.sku_count
    label: "Активных SKU"
    unit: "SKU"
    min: 1000
    max: 10000
    hint: "Сколько разных товаров сейчас в работе. На расчет не влияет: роботов считаем от числа строк и паллет, а не от ассортимента. Описывает склад в отчете. Тип хранения задается на плане, у каждой зоны хранения свой стеллаж"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: engine.simulation.availability
    ours: true
    label: "Роботов в строю"
    unit: "доля"
    min: 0.8
    max: 1.0
    hint: "Зарядку и очереди прогон смены считает сам. Здесь остальное: плановое ТО и мелкие поломки. 0,9 значит, что из 10 роботов в работе 9, и парк берем с запасом на десятого"
    src: "Границы наши: ниже 80% парк проще докупить, чем ждать ремонта"
  - path: facilities.warehouse.staff_loss_share
    ours: true
    label: "Потери рабочего времени"
    unit: "доля"
    min: 0.15
    max: 0.35
    hint: "Отпуска, больничные, текучесть: прибавка к нормативной численности"
    src: "Отраслевой датасет по складам, лист «Склад»: 25% (15-35%)"
  - path: facilities.warehouse.min_operator_posts
    ours: true
    label: "Минимум операторов в смене"
    unit: "чел"
    min: 0
    max: 5
    hint: "Сколько дежурных на объекте с роботами нужно всегда"
    src: "Границы наши: от нуля (присмотр на поставщике) до пяти"
  - path: economics.horizon_years
    ours: true
    label: "Горизонт расчета"
    unit: "лет"
    min: 3
    max: 10
    hint: "Типовой горизонт технико-экономического обоснования"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: economics.energy_price_rub_kwh
    label: "Тариф на электроэнергию"
    unit: "₽/кВт·ч"
    min: 4
    max: 15
    hint: "Цена для юрлица, смотрите в счете за электричество"
    src: "Границы наши: разброс нерегулируемых цен по регионам"
  - path: economics.wage_growth
    ours: true
    label: "Рост зарплат в год"
    unit: "доля"
    min: 0
    max: 0.2
    hint: "Прогноз Минэкономразвития на 2027-2029: около 7% в год"
    src: "Границы наши"

pallet_transport:
  - path: facilities.warehouse.operations.pallet_transport.volume_per_day
    key: true
    label: "Перемещений паллет в сутки"
    unit: "паллет/сут"
    min: 1000
    max: 10000
    hint: "Сложите приемку, отгрузку и перемещения внутри склада, в датасете это 1000 + 1000. Как поток делится, на число роботов не влияет: каждая паллета это один рейс от ворот до стеллажа или обратно"
    src: "Отраслевой датасет по складам, лист «Склад»: приемка и отгрузка по 500-5000"
  - path: facilities.warehouse.operations.pallet_transport.load_kg
    key: true
    label: "Масса паллеты с грузом"
    unit: "кг"
    min: 200
    max: 1500
    hint: "Средняя, по ней подбор отсеивает роботов, которые не поднимут груз. Берите тяжелые паллеты, если их много. Считаем европаллету 1200x800: размер площадки робота в каталоге не публикуют, поэтому габариты не проверяем"
    src: "Отраслевой датасет по складам, лист «Склад»: средняя масса грузовой единицы 200-1500 кг"
  - path: facilities.warehouse.operations.pallet_transport.automatable_share
    ours: true
    label: "Доля перевозок для роботов"
    unit: "доля"
    min: 0.5
    max: 1.0
    hint: "Остальное негабарит и нестандарт, в датасете это 5%"
    src: "Отраслевой датасет по складам, лист «Склад»: негабарит 0-30%"

piece_picking:
  - path: facilities.warehouse.operations.piece_picking.volume_per_day
    key: true
    label: "Строк отбора в сутки"
    unit: "строк/сут"
    min: 50000
    max: 500000
    hint: "Строка это одна позиция в заказе"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.operations.piece_picking.load_kg
    label: "Масса стеллажа с товаром"
    unit: "кг"
    min: 100
    max: 1200
    hint: "Робот возит к станции стеллаж целиком. Средний товар в датасете 1,8 кг, но сколько штук на стеллаже, никто не публикует: 600 кг наша оценка"
    src: "Границы наши: от легкой полки до предела самых мощных роботов товар к человеку"
  - path: facilities.warehouse.operations.piece_picking.automatable_share
    ours: true
    label: "Доля мелкоштучного отбора"
    unit: "доля"
    min: 0.1
    max: 0.8
    hint: "Остальное коробочный и паллетный отбор"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.operations.piece_picking.productivity_before
    ours: true
    label: "Выработка отборщика сейчас"
    unit: "строк/ч"
    min: 80
    max: 200
    hint: "Учитывает ходьбу, поиск и упаковку. По маршруту 25 м на строку из датасета выходит 54-79 строк в час, поэтому берем нижнюю границу датасета"
    src: "Отраслевой датасет по складам, лист «Склад»"
  - path: facilities.warehouse.operations.piece_picking.productivity_after
    ours: true
    label: "Выработка на станции после роботизации"
    unit: "строк/ч"
    min: 100
    max: 400
    hint: "Яндекс Роботикс заявляет 250-300 отборов в час на станции, факт на внедрениях Kiva 200-250 строк в час"
    src: "Границы наши: от текущей выработки до лучших заявленных значений"
  - path: facilities.warehouse.operations.piece_picking.ops_per_trip
    ours: true
    label: "Строк за одну подачу стеллажа"
    unit: "строк"
    min: 1
    max: 4
    hint: "Сколько позиций человек успевает снять с одного привезенного стеллажа. Замеров никто не публикует, по симуляции Merschformann 2018 выходит около 1,9"
    src: "Границы наши: выше 4 не встречается даже в заявлениях производителей"

cleaning:
  - path: facilities.warehouse.operations.cleaning.volume_per_day
    key: true
    label: "Площадь уборки в сутки"
    unit: "м2/сут"
    min: 1000
    max: 50000
    hint: "Площадь зоны работы роботов при уборке раз в сутки. Убираете дважды - поставьте вдвое больше"
    src: "Нет источника: площадь зоны работы роботов (в датасете активная зона), частоту уборки источник не дает"
  - path: facilities.warehouse.operations.cleaning.automatable_share
    ours: true
    label: "Доля площади для робота"
    unit: "доля"
    min: 0.3
    max: 1.0
    hint: "Проезды и открытые площади. Под стеллажами, в углах и у стен остается ручная уборка"
    src: "Нет источника: долю взяли сами"

robot:
  - path: robots.{robot}.price_rub
    label: "Цена робота"
    unit: "₽"
    relative: true
    min: 0.5
    max: 2
    hint: "Из каталога, с НДС, без доставки и пусконаладки. Поставьте цену из своего коммерческого предложения"
    src: "Границы наши: от половины до двух цен каталога"
  - path: robots.{robot}.maintenance_share_year
    label: "Обслуживание в год"
    unit: "доля"
    min: 0.03
    max: 0.2
    hint: "Доля от цены робота: плановое ТО, запчасти, выезды инженера. 0,1 это 10% цены в год"
    src: "Границы наши: от сервиса, который почти весь в гарантии, до двух норм производителя"
  - path: robots.{robot}.service_life_years
    label: "Срок службы"
    unit: "лет"
    min: 3
    max: 10
    hint: "Сколько лет робот работает до замены: от него амортизация и выкуп после аренды"
    src: "Постановление № 1: 3 группа 3-5 лет. Верхнюю границу подняли сами: робот с продленным сервисом служит дольше срока амортизации"

# Границы ползунков кредита и лизинга в блоке "Условия и господдержка" на шаге экономики.
# Это удобный диапазон на экране, а не запрет: число за краем можно вписать в поле, сервер его
# посчитает (свои пределы у него в calculation.py). Значения по умолчанию в config/model.yaml, financing
financing:
  - path: financing.loan.term_months
    label: "Срок кредита"
    unit: "мес"
    min: 12
    max: 84
    hint: "Инвестиционный кредит на оборудование"
    src: "Сбербанк Лизинг и ВТБ Лизинг до 7 лет, Европлан до 5 лет, Альфа-Лизинг от 12 до 59 месяцев (сайты компаний, 25.09.2026). Кредит на оборудование берем в тех же сроках"
  - path: financing.leasing.term_months
    label: "Срок лизинга"
    unit: "мес"
    min: 12
    max: 84
    hint: "Договор лизинга оборудования"
    src: "Европлан: оборудование от 12 месяцев до 5 лет; Альфа-Лизинг от 12 до 59 месяцев; Сбербанк Лизинг и ВТБ Лизинг до 7 лет (сайты компаний, 25.09.2026)"
  - path: financing.loan.rate
    label: "Ставка кредита"
    unit: "доля в год"
    min: 0
    max: 0.35
    hint: "Ставку выше края ползунка можно вписать числом"
    src: "Граница ползунка, не ставка рынка: ключевая ставка ЦБ в 2022-2026 годах была не выше 21% (cbr.ru, история ключевой ставки), средняя по кредитам МСП выше нее на единицы процентов"
  - path: financing.leasing.rate
    label: "Внутренняя ставка лизинга"
    unit: "доля в год"
    min: 0
    max: 0.35
    hint: "Ставку выше края ползунка можно вписать числом"
    src: "Граница ползунка, как у кредита: ставка лизинга по умолчанию это ставка кредита плюс 2 п.п."
