  operator_attention_min_per_hour: {v: 1.5, src: "Нет источника: считаем от сбоев. Если робот требует внимания раз в 2-4 часа и на разбор уходит 3-5 минут, это 0,75-2,5 минуты в час, берем середину. Один оператор тянет около 40 роботов", trust: F}
