# Роботы. catalog_id это номер решения в каталоге организатора (data/catalog/warehouse.csv):
# по нему подбор находит робота в модели.
# Производительность задается номиналом рейсов в час (nominal_trips_per_hour)
# или считается от маршрута: средняя скорость и время погрузки-выгрузки.
# raas: условия аренды. Выкуп в конце контракта по остаточной стоимости, см. docs/calculation.md.
robots:
- id: ronavi-h1500
  catalog_id: "5760e938-9a43-45a7-b8e8-f4f2e6383930"
  type: amr
  vendor: "Ronavi Robotics"
  model: "H1500"
  price_rub: {v: 2700000, src: "Каталог роботизированных решений ФЦ БАС (с НДС); на сайте производителя 2,16-2,7 млн", date: "2026-09", trust: B}
