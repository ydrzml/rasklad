  run_time_h: {v: 5, src: "Производитель и интегратор: 5 ч (data/specs/specs.csv)", date: "2026-09", trust: B}
  charge_time_h: {v: 3.5, src: "Время зарядки производитель не публикует, уточняем у производителя. Берем как у РУБИ-С-03 того же класса (бак 50 л, батарея 100 А*ч): 3,5 ч", trust: F}
  robots_per_charger: {v: 1, src: "У робота своя станция: он уезжает на нее сам, там же сливает и наливает воду", trust: F}
  charger_price_rub: {v: 0, src: "Станция слива и налива есть, цены производитель не публикует, уточняем у производителя", trust: F}
  software_rub: {v: 0, src: "Отдельной цены ПО производитель не публикует, уточняем у производителя, считаем что входит в цену робота", trust: F}
  commissioning_share: {v: 0.067, src: "аналог: пусконаладка Клинботикс от 100 тыс. руб при цене 1,5 млн (waybotrobotics.com/buy-rent), 6,7%", date: "2026-09", trust: D}
  maintenance_share_year: {v: 0.157, src: "аналог: сервис «под ключ» Клинботикс 30 000 руб в месяц, 360 000 в год (waybotrobotics.com/guarantee), у R2B около 20 000 в месяц; берем худшее: 360 000 / 2 300 000", date: "2026-09", trust: D}
  license_rub_year: {v: 360000, src: "Производитель: без подписки на ПО робот работает как ручная машина. Цена подписки есть только в бизнес-плане 2022 года, 30 000 руб в месяц (yacurier.com, устарело); текущую уточняем у производителя", trust: F}
  avg_power_kw: {v: 0.73, src: "аналог: РУБИ-С-03 того же класса, 2,56 кВт*ч за 3,5 ч; у Unit бортовая сеть 24 В, емкость не опубликована", date: "2026-09", trust: D}
  operator_attention_min_per_hour: {v: 1.5, src: "Нет источника: как у транспортных роботов, разбор сбоев", trust: F}
  service_life_years: {v: 5, src: "Постановление № 1: промышленные транспортные роботы (ОКОФ 330.28.99.39.213), 3 группа 3-5 лет, audit-it.ru", date: "2026-09", trust: C}
  battery_price_rub: {v: 141000, src: "аналог: РУБИ-С-03, 2,56 кВт*ч * 55 000 руб; литиевая 24 В 60 А*ч для поломоечной машины 59 850 руб (интегратор), тяговые LiFePO4 35-55 тыс. руб за кВт*ч, берем худшее", date: "2026-09", trust: D}
  battery_life_years: {v: 3, src: "Отраслевой датасет по складам, лист «Легенда»: замена АКБ раз в 3-5 лет; при работе 22 ч без выходных берем 3", date: "2026-09", trust: D}
  raas:
    fee_rub_month: {v: 127000, src: "Аренду производитель не публикует, уточняем у производителя. Берем как у Клинботикс 600 в доле от цены: 127 778 руб в месяц при цене 2,31 млн (waybotrobotics.com/buy-rent), то есть 2 300 000 * 127 778 / 2 310 000; у R2B MARK 2 SE 100 тыс. при 1,9 млн", date: "2026-09", trust: D}
    contract_months: {v: 36, src: "Яндекс Роботикс: подписка на 36 мес; Ronavi: оплата за действие от ~30 мес (ronavi-robotics.ru/pricing)", date: "2026-09", trust: C}
    damage_share_year: {v: 0.01, src: "Нет источника: условие договора аренды", trust: F}
    support_share: {v: 0, src: "Сколько присмотра за парком берет на себя поставщик при аренде. Доли никто не публикует. По умолчанию ноль: присмотр целиком на клиенте", trust: F}

# Объекты. Значения по умолчанию из отраслевого датасета.
# TODO: airport, hospital.
facilities:
- id: warehouse
  name: "Склад (торговля)"
  schedule:
    shifts: {v: 2, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
    shift_hours: {v: 11, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
    days_per_year: {v: 365, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
  constraints:
    aisle_width_mm: {v: 2800, src: "Отраслевой датасет по складам, лист «Склад»: ширина рабочих проходов между стеллажами 2,8 м (1,5-4,5)", date: "2026-09", trust: D}
    main_aisle_width_mm: {v: 3500, src: "Отраслевой датасет по складам, лист «Склад»: ширина главных проездов 3,5 м (2,5-6)", date: "2026-09", trust: D}
    floor_flatness_mm: {v: 3, src: "Отраслевой датасет по складам, лист «Склад»: отклонение 3 мм на 2 м (1-8), DIN 15185 или FM2", date: "2026-09", trust: D}
    ceiling_m: {v: 10, src: "Отраслевой датасет по складам, лист «Склад»: высота потолков в зоне хранения 10 м (5-16)", date: "2026-09", trust: D}
  min_operator_posts: {v: 1, src: "Допущение команды: на объекте с роботами всегда есть хотя бы один дежурный в смене", date: "2026-09", trust: F}
  peak_factor: {v: 1.5, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
  fast_share: {v: 0.2, src: "Отраслевой датасет по складам, лист «Склад»: доля SKU с быстрым оборотом (A-класс) 20% (10-40%). Считаем, что у каждой позиции свое место у стеллажа", date: "2026-09", trust: D}
  fast_picks_share: {v: 0.75, src: "Bartholdi, Hackman. Warehouse & Distribution Science, версия 0.98.1 от 17.08.2019, рис. 14.1, с. 241: 5000 самых ходовых из 25 000 SKU дают больше 75% отборов; warehouse-science.com. Популярное правило 80/20 встречается только во вторичных источниках", date: "2026-09", trust: C}
  slotted_by_turnover: {v: 0, src: "Выбор клиента: разложен ли товар по ходовости, 1 да, 0 нет. По умолчанию нет: так расчет осторожнее, а на Восток-Сервисе роботов и без этого вышло вдвое больше нашей формулы", trust: F}
  staff_loss_share: {v: 0.25, src: "Отраслевой датасет по складам, лист «Склад»: +25% к нормативной численности", date: "2026-09", trust: D}
  active_area_m2: {v: 10000, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
  picking_zone_share: {v: 0.28, src: "Часть зоны работы роботов под робозону штучного отбора. Посчитано: парк по формуле 56 Ronavi M * 50 м2 на робота (engine.geometry.picking_m2_per_robot) = 2 800 м2 из 10 000 м2, с округлением до 100 м2. Правит человек на первом шаге", date: "2026-09", trust: D}
  sku_count: {v: 2000, src: "Отраслевой датасет по складам, лист «Склад»: активных SKU 2000 (1000-10000). В расчет не входит, описание склада для отчета", date: "2026-09", trust: D}
  operator_salary_premium: {v: 0, src: "Оператор робозоны это переученный сотрудник той же роли. Яндекс Роботикс, раздел «Персонал»: «Сотрудники на точках отбора — операторы роботов». Надбавку за роботов никто не публикует, поэтому пока ноль. Для сравнения: сервисный инженер по роботам в Москве стоит 138-207 тыс. gross (4 вакансии hh.ru, сентябрь 2026), но это другая профессия", trust: F}
  implementation:
    integration_rub: {v: 5000000, src: "Нет источника, нужно КП интегратора", trust: F}
    infrastructure_rub: {v: 3000000, src: "Нет источника", trust: F}
    retraining_rub_per_person: {v: 10000, src: "Курсы ДПО «оператор механизированных и автоматизированных складов»: 5 000 руб (Grand School, 80 ч) и 12 491 руб (ЕВИДПО, 72 ч). Срок сходится с Ronavi: обучение оператора 1-2 недели", date: "2026-09", trust: C}
    hiring_rub_per_person: {v: 50000, src: "Нет источника: подбор оператора роботов с рынка, если замененных людей не хватает. Вакансии такие есть (RWB, X5 Tech), стоимости подбора нет", trust: F}
    communications_rub_year: {v: 300000, src: "Нет источника", trust: F}
  # Штат объекта. Роли берутся из config/roles.yaml, пользователь набирает список сам
  # и может добавить одну роль несколько раз, если внутри нее разные ставки.
  # headcount это ставки по штатному расписанию, filled - сколько из них занято людьми.
  # Если filled не указан, штат считается полным. Незанятая ставка денег не стоит,
  # поэтому роботы закрывают сначала ее, и только потом высвобождают живых людей.
  # Здесь лежат только две роли из отраслевого датасета, остальной штат вводит пользователь.
  staff:
  - id: forklift-operators
    role: forklift_operator
    headcount: {v: 25, src: "Отраслевой датасет по складам, лист «Склад»: операторы погрузчиков", date: "2026-09", trust: D}
    salary_month: {v: 120000, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
  - id: pickers
    role: picker
    headcount: {v: 100, src: "Отраслевой датасет по складам, лист «Склад»: отборщики", date: "2026-09", trust: D}
    salary_month: {v: 100000, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
  # Уборку на складах почти всегда отдают клининговой компании, поэтому строка помечена
  # как люди подрядчика: взносы на них не начисляются, в цене договора уже все есть.
  - id: cleaners
    role: cleaner
    contractor: true
    headcount: {v: 10, src: "В отраслевом датасете уборщиков нет. Вывели из норматива: активная зона 10 000 м2, уборка раз в сутки, норма 230 м2/ч, фонд 1972 ч, потери 25%. Дает 10,06 ставки", date: "2026-09", trust: F}
    salary_month: {v: 60000, src: "config/roles.yaml, роль cleaner", date: "2026-09", trust: E}
  operations:
  - id: pallet_transport
    name: "Перевозка паллет между зонами"
    unit: "паллет/сут"
    processes: ["Внутрискладская логистика", "Внутрипроизводственная логистика"]
    # Роли в том порядке, в каком роботы забирают у них ставки: сначала те, чью работу
    # робот повторяет целиком, остаток уходит следующей роли.
    performed_by: [forklift_operator, loader]
    load_kg: {v: 800, src: "Отраслевой датасет по складам, лист «Склад»: средняя масса грузовой единицы 800 кг (200-1500)", date: "2026-09", trust: D}
    volume_per_day: {v: 2000, src: "Отраслевой датасет по складам, лист «Склад»: приемка 1000 + отгрузка 1000", date: "2026-09", trust: D}
    automatable_share: {v: 0.95, src: "Отраслевой датасет по складам, лист «Склад»: негабарит 5% остается ручным", date: "2026-09", trust: D}
    ops_per_trip: {v: 1, src: "Одна паллета за рейс", date: "2026-09", trust: S}
  - id: piece_picking
    name: "Мелкоштучный отбор"
    unit: "строк/сут"
    processes: ["Внутрискладская логистика", "Сортировка грузов"]
    performed_by: [picker]
    load_kg: {v: 600, src: "Нет источника: масса мобильного стеллажа с товаром, допущение команды", trust: F}
    volume_per_day: {v: 100000, src: "Отраслевой датасет по складам, лист «Склад»", date: "2026-09", trust: D}
    automatable_share: {v: 0.3, src: "Отраслевой датасет по складам, лист «Склад»: доля piece-pick 30%", date: "2026-09", trust: D}
    productivity_before: {v: 80, src: "Отраслевой датасет по складам, лист «Склад»: нижняя граница выработки 80 строк/ч (база 150). Проверка маршрутом из того же листа: 25 м на строку при ходьбе 0,75-1 м/с (Elbert и др., Winter Simulation Conference 2015; arXiv 2408.01656, 2024) и доле ходьбы 50-55% времени (Tompkins и др. 2003 по De Koster и др., EJOR 182, 2007; Bartholdi, Hackman, Warehouse & Distribution Science) дает 54-79 строк/ч. 150 остается верхней границей", date: "2026-09", trust: D}
    productivity_after: {v: 250, src: "Яндекс Роботикс: до 250-300 отборов/ч на станции (robotics.yandex.ru/robotizatsiya-sklada), берем нижнюю. Сходится с фактом Kiva у Gilt Groupe 200-250 строк/ч (MWPVL, 02.2012, mwpvl.com/html/kiva_systems.html) и обзором 200-300 строк/ч на человека (Lamballais и др., EJOR 256, 2017)", date: "2026-09", trust: C}
    ops_per_trip: {v: 1.9, src: "Merschformann и др. 2018 (arxiv.org/pdf/1801.06703), симуляция: в среднем 2,8 штуки за подачу стеллажа, при 1,5 штуки на строку из датасета это 1,9 строки. Замеров в строках никто не публикует, поэтому оценка D", date: "2026-09", trust: D}
    # Людей на отборе считаем от объема по нормативу, а не долей от штата: штат отборщиков
    # в датасете не сходится с его же объемом (docs/decisions.md, «Люди в отборе от объема»)
    people_from_volume: {v: 1, src: "Правило расчета: ставки на отборе = объем / выработка / фонд времени с потерями 25%", date: "2026-09", trust: S}
  - id: cleaning
    name: "Уборка полов и проездов"
    unit: "м2/сут"
    processes: ["Уборка помещений"]
    # Уборочному роботу не нужна ни интеграция с WMS, ни переделка инфраструктуры:
    # он ездит по тем же проездам и уезжает на свою док-станцию.
    implementation:
      integration_rub: {v: 0, src: "Робот-уборщик работает без связи с WMS: маршрут задается на самом роботе", trust: F}
      infrastructure_rub: {v: 0, src: "Нужны место и розетка под док-станцию, отдельной цены нет. Ноль означает «не учли», а не «бесплатно»", trust: F}
    performed_by: [cleaner]
    volume_per_day: {v: 10000, src: "Нет источника: площадь зоны работы роботов (в датасете активная зона, 10 000 м2) при уборке раз в сутки. Частоту источник не дает, это наше допущение", trust: F}
    automatable_share: {v: 0.7, src: "Нет источника: робот моет проезды и открытые площади, под стеллажами, в углах и у стен остается ручная уборка. Долю взяли сами", trust: F}
    ops_per_trip: {v: 1, src: "Один квадратный метр за операцию", date: "2026-09", trust: S}
    # У мойки пола нет пикового часа: площадь смены известна с утра и моется за смену. Парк берем
    # под средний час, а не под пик склада, и раскладываем участки по смене (docs/calculation.md, раздел 1)
    steady: {v: 1, src: "Нет источника: пиковый коэффициент датасета описывает поток паллет и строк, у уборки пика нет, площадь смены моется за смену. Допущение команды", date: "2026-09", trust: F}
