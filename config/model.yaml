# Роботы-уборщики. Производительность в м2/ч лежит в nominal_trips_per_hour: операция уборки это квадратный метр.
# Для прогона смены рейс уборщика это участок area_per_trip_m2: робот выезжает с базы, моет зону,
# если хватает бака и заряда, и возвращается на базу. Аренду публикуют Клинботикс и R2B, у остальных
# она взята в той же доле от цены, что у Клинботикс 600, с пометкой, что уточняем у производителя.
- id: clinbotics-400-pro
  catalog_id: "f31223c1-44c8-4410-8381-6356e2158b61"
  type: cleaning
  vendor: "Вейбот Автомакон Роботикс"
  model: "Клинботикс 400 PRO"
  price_rub: {v: 1500000, src: "Каталог роботизированных решений ФЦ БАС (с НДС); то же у производителя (waybotrobotics.com/buy-rent)", date: "2026-09", trust: A}
  nominal_trips_per_hour: {v: 700, src: "Производитель и интегратор: 700-1200 м2/ч, берем худшее; 700 это 0,47 паспортной 1500, так и бывает у роботов (реальная 0,4-0,5 паспортной)", date: "2026-09", trust: B}
  area_per_trip_m2: {v: 933, src: "Участок за один выезд это зона уборки, но не больше, чем хватит бака и заряда. Зона 1000 м2: в кейсе R2B гипермаркет 3000 м2 разбит на 3 зоны, типового размера никто не публикует. Бак 28 л (чистой воды по карточке производителя, на главной 25) / 0,03 л на м2 = 933 м2: расход воды производитель не публикует, берем худший у похожих роботов, Kärcher KIRA B 50, 55 л на 1830 м2 (у Pudu 0,004-0,010, у Unit около 0,007). На одном заряде робот вымоет 2100 м2. Берем меньшее", date: "2026-09", trust: D}
  avg_speed_m_s: {v: 0.7, src: "Скорость переезда к участку не опубликована, берем 2/3 максимальной, как у транспортных роботов (у Ronavi H1500 средняя 1 м/с при максимуме 1,5). Максимум этого робота производитель не публикует, уточняем у производителя; у похожих 1,05-1,5 м/с (Gausium, Nilfisk), берем худшее: 1,05 * 2/3", date: "2026-09", trust: D}
  handling_s: {v: 5398, src: "Мойка участка 933 м2 при 700 м2/ч это 4798 с, плюс слив и налив воды на базе: 600 с на полный бак, на участок 933 из 933 м2 это 600 с. Сколько идут слив и налив, не публикует ни один производитель (Gausium, Pudu, Kärcher, Tennant), 10 минут на бак это допущение команды", trust: F}
  refill_s: {v: 600, src: "Часть handling_s, которую робот стоит на базе, остальное он моет на участке. На базе только слив и налив воды: 600 с на полный бак, на участок 933 из 933 м2 это 600 с. Сколько идут слив и налив, не публикует ни один производитель, 10 минут на бак это допущение команды", trust: F}
  utilization: {v: 0.75, src: "Отраслевой датасет по складам, лист «Легенда»: загрузка 70-85%, включает зарядку и простои", date: "2026-09", trust: D}
