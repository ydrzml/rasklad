  blocked: "получатель только с ОКВЭД раздела C, роботы в производственных процессах (решение Минпромторга 25-60987-01963-Р, версия 3), склад 52.10 не проходит"
  chosen: {v: 0, src: "Выбор пользователя. Для склада мера недоступна, поэтому отметка не действует", date: "2026-09", trust: S}
  share: {v: 0.2, src: "\"до 20% затрат\" только в новостях отбора (Техэксперт, 22.06.2026; RUБЕЖ, 21.09.2026), в тексте решения 25-60987-01963-Р формула без числа", date: "2026-09", trust: D}
  cap_rub: {v: 80000000, src: "Решение Минпромторга 25-60987-01963-Р: не более 80 млн руб на получателя (Техэксперт, 22.06.2026)", date: "2026-09", trust: C}

