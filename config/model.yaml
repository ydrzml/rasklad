# Конфигурация расчетной модели. Значения меняем здесь, код трогать не нужно.
#
# Каждое значение записано вместе с источником:
#   {v: <число>, src: "<откуда>", date: "<ГГГГ-ММ>", trust: <оценка>}
# Оценка доверия по общей шкале проекта (docs/data-sources.md, «Оценка достоверности»):
#   S закон или норматив, спорить не о чем      A производитель и независимая проверка
#   B сходятся два разных типа источников        C один источник
#   D только организатор или только СМИ          E источники расходятся
#   F источника нет, это наше допущение (из папки backend: python -m scripts.run_example покажет, сколько таких)
# Число без источника и оценки вне meta и engine не пройдет тест.
#
# Сейчас значения совпадают с эталоном, посчитанным в Excel.

meta:
  version: 0.2

engine:
  max_fleet: 500
  max_fleet_simulated: 250  # до какого парка гоняем смену; кривая останавливается раньше, когда дошла до спроса или вышла на полку
  # Веса подбора: из чего складывается балл решения. Показываем их пользователю вместе с вкладом.
  # Прогон смены: сколько часов моделируем и как часто гоняем смену для кривой парка.
  # Проезды и места у ворот больше не константы: их дает план объекта (config/layouts.yaml).
  simulation:
    hours: 8
    seed: 42  # прогон для проигрывателя
    seeds: [42, 7, 2026]  # поиск парка: парк подтверждаем на каждом. Не данные, а то, как мы меряем
    workers: 6  # сколько прогонов поиска парка идут одновременно, в отдельных процессах
    curve_step: 2  # через сколько роботов гоняем смену: между замерами кривую достраиваем линейно
    robots_per_aisle: {v: 3, src: "Сколько роботов помещаются в одной части проезда между рядами, от поперечного проезда до поперечного. Источника нет: зависит от длины части и дистанции между роботами, допущение команды", trust: F}
    availability: {v: 0.9, src: "Что остается от коэффициента загрузки после симуляции: очереди и зарядку она считает сама, остаются плановое ТО и мелкие простои. Источника нет, допущение команды", trust: F}
    peak_hours: {v: 2, src: "Нет источника: сколько длится пик. Датасет дает только отношение пикового часа к среднему (лист «Склад», 1,5), форму дня для склада не публикует никто. Берем два часа, допущение команды", trust: F}
  selection:
    weights: {process: 0.3, maturity: 0.2, verified: 0.15, data: 0.2, headroom: 0.15}
    fields: [payload_kg, min_aisle_width_mm, max_speed_m_s, runtime_h, charge_time_h, throughput]  # до какого размера парка строить кривую пропускной способности
    stacking_lift_mm: {v: 1000, src: "Наше правило: подъем до метра это подхват паллеты с пола, выше это штабелирование в стеллаж. Только штабелерам проверяем, достают ли они до верхнего яруса", trust: F}
  geometry:
    route_factor: {v: 0.75, src: "Геометрия: квадратная зона, ворота посередине стороны, движение по проходам: среднее расстояние 0,25 + 0,5 стороны", date: "2026-09", trust: F}
    # Плотность робозоны «товар к человеку»: от нее площадь по умолчанию под отбор (facilities.*.picking_zone_share)
    picking_m2_per_robot: {v: 50, src: "Кейсы внедрений, страницы открыты 29.09.2026. Decathlon Куньшань, Geek+ P800, blog.geekplus.com: \"46 P800 robots\", \"project area is about 2,000 square meters\", \"7 picking stations\" - 43 м2 на робота. HIK, Япония, en.myrobotsolution.com: \"181 AMRs\", \"26 workstations\", warehouse \"spanning over 11,000 m2\" - 61 м2 на робота. Geek+ в Китае (nissa-eng.ru не открылся, страница-тег blog.geekplus.com без цифр по конкретному складу) и Tmall (thewirechina.com за платным доступом) не подтвердились. По двум подтвержденным случаям 43-61, среднее около 52, оставляем 50 между ними", date: "2026-09", trust: C}

economics:
  horizon_years: {v: 5, src: "Отраслевой датасет по складам, лист «Склад»: горизонт окупаемости 5 лет (3-10)", date: "2026-09", trust: D}
  annual_work_hours: {v: 1972, src: "Производственный календарь 2026, 40-часовая неделя, consultant.ru/law/ref/calendar/proizvodstvennye/2026/", date: "2026-09", trust: S}
  discount_rate: {v: 0.14, src: "Ключевая ставка ЦБ 14,00%, решение 11.09.2026, без премии за риск", date: "2026-09", trust: C}
  wage_growth: {v: 0.07, src: "Сценарные условия Минэкономразвития на 2027-2029, 12.05.2026, garant.ru/products/ipo/prime/doc/414115625/: +6,5% (2027), +6,9% (2028), +7,1% (2029), берем около 7%", date: "2026-09", trust: C}
  energy_price_growth: {v: 0.09, src: "Сценарные условия Минэкономразвития на 2027-2029, 12.05.2026, garant.ru/products/ipo/prime/doc/414115625/: сетевые тарифы для прочих +13,0% (2027), +8,9% (2028), +6,3% (2029), в среднем около 9%", date: "2026-09", trust: C}
  inflation: {v: 0.04, src: "Прогноз ЦБ 11.09.2026: 4,0% в 2027; МЭР: 4,0% в 2027-2029", date: "2026-09", trust: C}
  energy_price_rub_kwh: {v: 9, src: "Нет подтвержденного источника: взять предельный уровень нерегулируемых цен на mosenergosbyt.ru, СН2/НН", trust: F}
  capex_reserve_share: {v: 0.1, src: "Отраслевой датасет по складам, лист «Легенда»: CAPEX включает резерв 10%", date: "2026-09", trust: D}
  peak_reserve_share: {v: 0.15, src: "Отраслевой датасет по складам, лист «Легенда»: резерв 15-20%, берем нижнюю границу", date: "2026-09", trust: D}
  payback_bands_years: {v: [3, 5], src: "ТЗ, п. 3.5.7: интервалы до 3 лет, 3-5 лет, более 5 лет", date: "2026-09", trust: S}
  payroll:
    insurance_rate: {v: 0.3, src: "НК РФ ст. 425, редакция 04.08.2026", date: "2026-09", trust: S}
    insurance_rate_above_limit: {v: 0.151, src: "НК РФ ст. 425, редакция 04.08.2026", date: "2026-09", trust: S}
    insurance_base_limit_rub: {v: 2979000, src: "Постановление Правительства от 31.10.2025 № 1705", date: "2026-09", trust: S}
    injury_insurance_rate: {v: 0.006, src: "ОКВЭД 52.10: 5 класс профриска (приказ Минтруда 851н), тариф 0,6% (179-ФЗ, 434-ФЗ). В датасете 0,2%", date: "2026-09", trust: S}
    workwear_rub_year: {v: 0, src: "Нет источника, пока не учитываем", trust: F}
    turnover_rate: {v: 0, src: "Для склада в датасете нет, пока не учитываем", trust: F}
    hire_cost_months: {v: 0, src: "Нет источника, пока не учитываем", trust: F}

# Как платить за покупку: свои деньги, кредит или лизинг (Дополнения к ТЗ, п. 2.1). Аренду не меняет.
# Способ выбирает пользователь на шаге экономики, значения ниже правятся там же. Формулы в docs/calculation.md.
financing:
  method: {v: 0, src: "Выбор пользователя: 0 свои деньги, 1 кредит, 2 лизинг. По умолчанию свои деньги: так считает базовый сценарий в Дополнениях к ТЗ, п. 2.1", date: "2026-09", trust: S}
  loan:
    rate: {v: 0.15, src: "ЦБ, средневзвешенная ставка по кредитам малому и среднему бизнесу на срок свыше года без льготных, июль 2026: 14,86% (cbr.ru/statistics/bank_sector/int_rat, опубликовано 08.09.2026). Это фактические сделки; в витрине Сбера инвестиционный кредит \"от 18%\" (26.09.2026)", date: "2026-09", trust: C}
    term_months: {v: 60, src: "Типовой срок кредита на оборудование совпадает со сроком лизинга: у Европлана и Альфа-Лизинга до 5 лет, у Сбербанк Лизинга и ВТБ Лизинга до 7 (сайты компаний, 25.09.2026). Равный срок горизонту расчета, чтобы долг не выходил за него", date: "2026-09", trust: C}
    own_share: {v: 0.2, src: "Нет источника: сколько своих денег просит банк, зависит от заемщика. Сбер при залоге покупаемого имущества минимум \"не устанавливает\" (sberbank.ru, инвестиционный кредит, 26.09.2026). Берем как аванс лизинга", trust: F}
    # тело долга гасится равными долями каждый месяц, проценты с остатка: так по умолчанию у Сбера
    # (\"ежемесячно равными долями\", sberbank.ru, инвестиционный кредит, 26.09.2026)
  leasing:
    rate: {v: 0.17, src: "Нет опубликованного значения: удорожание лизинговые компании не публикуют. Ставка кредита 15% плюс 2 п.п. за риск лизинговой компании. Храним ставку, а удорожание выводим из нее: Альфа-Лизинг предупреждает, что при удорожании X% в год ставка может доходить до 2X% (alfaleasing.ru, процент удорожания в лизинге)", trust: F}
    term_months: {v: 60, src: "Европлан: оборудование от 12 месяцев до 5 лет; Альфа-Лизинг: от 12 до 59 месяцев (сайты компаний, 25.09.2026)", date: "2026-09", trust: C}
    advance_share: {v: 0.2, src: "Аванс у лизинговых компаний от 0-5% до 49% (Сбербанк Лизинг, ВТБ Лизинг, Альфа-Лизинг, Европлан, 25.09.2026), ФРП требует от 10%. Берем 20%, точного типового значения никто не публикует", date: "2026-09", trust: F}
  insurance_share_year: {v: 0.007, src: "Страхование залога при кредите (Сбер: \"страхование залога: требуется\") и предмета лизинга (платит клиент, Газпромбанк Автолизинг 14.04.2022). Процент в год банки не публикуют. ПСБ Страхование (01.03.2022): легковой автомобиль 6-10% от суммы, промышленное оборудование \"в 10 раз дешевле\", то есть 0,6-1%. Берем 0,7% цены роботов и зарядок в год, пока долг не погашен", date: "2026-09", trust: D}
  debt_cover_min: {v: 1.2, src: "Во сколько раз поток должен покрывать платежи по долгу (DSCR), чтобы банк дал кредит: 1,2 для надежных проектов, 1,4 чаще всего у действующих предприятий (Альт-Инвест, alt-invest.ru). Порог конкретного банка не публикуется. Ниже порога только предупреждаем", date: "2026-09", trust: C}

# Выход на режим: первые месяцы роботы дают не весь эффект, люди уходят не сразу. Помесячных
# процентов не публикует никто (ни производители, ни McKinsey, MHI, DHL), поэтому это допущения F.
# Вид задачи: station, если человек остается на операции у станции (товар к человеку), иначе simple.
ramp_up:
  simple:
    first_month_share: {v: 0.7, src: "Нет источника: сколько эффекта дают роботы в первый месяц. Про простые AMR пишут \"up and running in days, not months\" (Locus Robotics, Rapid Deployment), пилот Ronavi около 4 недель (ronavi-robotics.ru/industry/3pl); просадку 10-20% в первые две недели называет JIT Transportation без источника", trust: F}
    months: {v: 1, src: "Нет источника: через сколько месяцев выход на полный эффект. Внедрение простых AMR 4-8 недель (6 River Systems, Ronavi)", trust: F}
  station:
    first_month_share: {v: 0.2, src: "Нет источника. Toyota Automated Logistics (блог 20.08.2026): после запуска выработка \"barely beat manual levels\", потом 4 недели перестройки; у Восток-Сервиса через несколько месяцев ускорение в 2,5 раза при цели в 5-6 (Retail.ru, 28.06.2024)", trust: F}
    months: {v: 5, src: "Нет источника: Kardex для AutoStore обещает выйти на бизнес-план \"in as little as six months\" (MMH, 12.03.2024), от какой точки считать, неясно", trust: F}

# Меры господдержки для склада в Москве. chosen: 1, если пользователь отметил меру на шаге экономики.
# blocked: почему мера недоступна нашим объектам (все в Москве, ни один не обрабатывающее производство).
# Склад (ОКВЭД 52.10) не обрабатывающее производство, поэтому московские меры ДПиИР и МФППиП,
# займы ФРП "Проекты развития" и федеральный инвестиционный вычет ему не положены: там получатели
# только из раздела C ОКВЭД. Налоговый коэффициент 2 по ст. 257 НК не считаем: налог на прибыль вне модели.
subsidies:
- id: msp-1764
  name: "Льготный кредит МСП, программа 1764"
  kind: loan_rate
  operator: "Корпорация МСП и банки-партнеры"
  conditions: "Малые и средние компании, инвестиционные цели, сумма от 25 млн руб, льготная ставка 3 года (у ВТБ до 5), дальше ставка по договору. Решение за банком"
  blocked: "транспортировка и хранение входят в программу только в СКФО, ДФО, Крыму и Севастополе (corpmsp.ru; ВТБ: \"Транспортировка и хранение (ОКВЭД 52), только если заемщик зарегистрирован в СКФО, ДФО, Республике Крым, г. Севастополе\", 26.09.2026)"
  chosen: {v: 0, src: "Выбор пользователя. Для склада в Москве мера недоступна, поэтому отметка не действует", date: "2026-09", trust: S}
  rate: {v: 0.105, src: "corpmsp.ru, программа стимулирования кредитования МСП: ставка \"ключевая ставка ЦБ - 3,5%\" при ключевой выше 12%. Ключевая 14,00% (решение ЦБ 11.09.2026), 14 - 3,5 = 10,5% (26.09.2026)", date: "2026-09", trust: B}
- id: frp-leasing
  name: "Заем ФРП на аванс по лизингу"
  kind: leasing_advance_loan
  operator: "Фонд развития промышленности, заем получает лизингополучатель, лизингодатель из уполномоченных фондом"
  conditions: "Вне обрабатывающих производств только оборудование из реестра российской промышленной продукции (постановление 719), проект от 20 млн руб. Фонд проверяет производственные активы заявителя, складу могут отказать. Работает только с лизингом (стандарт СФ-И-53 от 29.05.2026)"
  chosen: {v: 0, src: "Выбор пользователя", date: "2026-09", trust: S}
  rate: {v: 0.01, src: "frprf.ru/zaymy/lizing: \"1% на промышленное оборудование, произведенное в России\", заем до 5 лет (25.09.2026)", date: "2026-09", trust: C}
  price_share: {v: 0.45, src: "Стандарт ФРП СФ-И-53, ред. 8.3 от 29.05.2026 (bod.frprf.ru): заем не больше 45% стоимости оборудования. Во вторичных источниках для необрабатывающих отраслей 27%, в стандарте такого ограничения мы не нашли", date: "2026-09", trust: B}
  advance_share: {v: 0.9, src: "frprf.ru/zaymy/lizing: заем покрывает до 90% аванса (25.09.2026)", date: "2026-09", trust: C}
  term_months: {v: 60, src: "Стандарт ФРП СФ-И-53: заем \"не более 5 лет и не более срока действия договора лизинга\" (29.05.2026)", date: "2026-09", trust: B}
  grace_months: {v: 36, src: "Стандарт ФРП СФ-И-53: \"погашение основного долга ... равными ежеквартальными платежами в течение последних двух лет срока займа\", до этого только проценты (29.05.2026). В расчете тело равными долями по месяцам последних двух лет", date: "2026-09", trust: B}
  min_project_rub: {v: 20000000, src: "frprf.ru/zaymy/lizing: бюджет проекта от 20 млн руб (25.09.2026)", date: "2026-09", trust: C}
- id: minpromtorg-robotics
  name: "Возврат части затрат на роботизацию, Минпромторг"
  kind: capex_refund
  operator: "Минпромторг России, нацпроект \"Средства производства и автоматизации\""
