# Справочник ролей персонала. Отсюда пользователь набирает штат своего объекта.
#
# Роль тут описана один раз и не знает ничего про роботов. Заменяется роль или нет,
# решает не справочник, а операция: операция ссылается на роли, которые ее выполняют.
# Роль, которую не называет ни одна операция, роботы не трогают, и это видно из данных,
# а не из отдельной пометки.
#
# group нужна только чтобы сгруппировать список в форме, на расчет она не влияет:
#   floor    - линейный персонал: те, кто делает саму работу на складе
#   support  - учет, контроль, обслуживание
#   robots   - роли, которые появляются после роботизации, пользователь их не вводит
#
# salary_month  оклад до вычета НДФЛ (gross), как в отраслевом датасете. Это значение
#               по умолчанию, пользователь ставит свое. Взносы модель добавляет сама.
# salary_range  вилка по рынку: нижняя и верхняя граница. По ней проверяем ввод и показываем
#               рядом с полем, чтобы одно число не выглядело точным ответом. Вилка есть не у всех
#               ролей: где источник дает только среднее, поля нет, и это видно.
# productivity  выработка человека в час. Нужна там, где роботы забирают работу:
#               по ней объем операции переводится в ставки. Где выработки нет,
#               роль может стоять в штате, но заменять по ней нечего.

roles:
  - id: picker
    name: Отборщик (комплектовщик)
    what: Собирает заказы, ходит по складу и снимает позиции со стеллажей
    group: floor
    salary_month: {v: 100000, src: "Отраслевой датасет по складам, лист «Склад»: средняя з/п отборщика (gross)", date: "2026-09", trust: D}
    salary_range: {v: [70000, 150000], src: "Отраслевой датасет по складам, лист «Склад», колонки диапазона. Агрегатор вакансий дает по комплектовщику медиану 102 000 при вилке 78 000-125 000, это внутри", date: "2026-09", trust: D}
    productivity: {v: 80, src: "Отраслевой датасет по складам, лист «Склад»: нижняя граница выработки отборщика 80 строк/ч (база 150). Проверка маршрутом из того же листа: 25 м на строку при ходьбе 0,75-1 м/с (Elbert и др., Winter Simulation Conference 2015; arXiv 2408.01656, 2024) и доле ходьбы 50-55% времени (Tompkins и др. 2003 по De Koster и др., EJOR 182, 2007; Bartholdi, Hackman, Warehouse & Distribution Science) дает 54-79 строк/ч. 150 остается верхней границей", date: "2026-09", trust: D}
    productivity_unit: строк/ч

  - id: forklift_operator
    name: Оператор погрузчика
    what: Возит паллеты между зонами на погрузчике, штабелере или ричтраке
    group: floor
    salary_month: {v: 120000, src: "Отраслевой датасет по складам, лист «Склад» дает 120 000; обзор рынка труда IBC Real Estate и ОЭЗ «Максимиха», август 2026, дает 119 000 по водителям погрузчиков, штабелеров и ричтраков Московского региона. Два разных источника сходятся в пределах 1%", date: "2026-09", trust: B}
    salary_range: {v: [80000, 170000], src: "Отраслевой датасет по складам, лист «Склад», колонки диапазона", date: "2026-09", trust: D}
    productivity: {v: 18.5, src: "Выведено из отраслевого датасета: 2000 паллет в сутки, 25 ставок, режим 2 смены по 11 часов 365 дней, потери рабочего времени 25%. Дает 4,9 человека на смене и 18,5 паллет в час на человека. Рыночные ориентиры 16-25 движений в час, значение попадает в диапазон", date: "2026-09", trust: D}
    productivity_unit: паллет/ч

  - id: loader
    name: Грузчик
    what: Перемещает грузы вручную и на тележке, помогает на приемке и отгрузке
    group: floor
    salary_month: {v: 82000, src: "Источники расходятся: обзор рынка труда IBC Real Estate, август 2026, дает 103 000 по группе «грузчики, кладовщики, комплектовщики», агрегатор вакансий по грузчику-кладовщику Москвы дает 82 476. По правилам данных при расхождении берем значение, при котором окупаемость хуже: для роли, которую забирают роботы, это меньшая зарплата", date: "2026-09", trust: E}
    productivity_note: >-
      Выработки грузчика не нашли ни в датасете, ни на рынке. Роль можно держать в штате,
      но объем в ставки по ней не переводится. Вывести обратным счетом не из чего:
      численности грузчиков в отраслевом датасете нет.

  - id: packing_operator
    name: Оператор упаковочной линии
    what: Работает на упаковке и маркировке готовых заказов
    group: floor
    salary_month: {v: 103000, src: "Прямого источника нет. Отраслевой датасет дает численность роли (20 человек), но не зарплату, и на рынке по этой должности нормальной цифры не нашли. Подставили ближайшую группу рынка: грузчики, кладовщики, комплектовщики", trust: F}

  - id: cleaner
    name: Уборщик
    what: Убирает полы и проезды в складских помещениях
    group: floor
    salary_month: {v: 60000, src: "Агрегаторы вакансий, сентябрь 2026: уборщик складских помещений по области 58 000, уборщик производственных помещений Москвы 55 000-68 000. Источники расходятся больше чем на 10%, взяли середину", date: "2026-09", trust: E}
    salary_range: {v: [55000, 68000], src: "Агрегаторы вакансий, сентябрь 2026: нижняя граница по уборщику производственных помещений, верхняя по уборщику вообще", date: "2026-09", trust: E}
    productivity: {v: 230, src: "Типовые нормы обслуживания для уборщиков производственных помещений: 0,26 минуты на квадратный метр влажной уборки вручную, это 230 м2 в час. Документ 1989 года, поэтому высшую оценку не ставим", date: "2026-09", trust: B}
    productivity_unit: м2/ч

  - id: storekeeper
    name: Кладовщик
    what: Ведет учет и размещение товара, отвечает за адресное хранение
    group: support
    salary_month: {v: 103000, src: "Обзор рынка труда IBC Real Estate и ОЭЗ «Максимиха», август 2026: грузчики, кладовщики и комплектовщики одной группой", date: "2026-09", trust: D}

  - id: receiver
    name: Приемщик
    what: Принимает поставки, сверяет документы и количество
    group: support
    salary_month: {v: 87000, src: "Агрегатор вакансий, 2026: приемщик товара в Москве 87 184. Это средняя по объявлениям, а не по фактическим выплатам", date: "2026-09", trust: E}

  - id: inspector
    name: Контролер
    what: Проверяет собранные заказы и участвует в инвентаризации
    group: support
    salary_month: {v: 75000, src: "Агрегатор вакансий, 2026: контролер склада в Москве 74 790, контролер вообще 78 061. Это средняя по объявлениям", date: "2026-09", trust: E}

  - id: wms_operator
    name: Оператор WMS
    what: Ведет складскую систему, разбирает расхождения и ставит задачи
    group: support
    salary_month: {v: 92000, src: "Агрегатор вакансий, 2026: оператор склада в Москве 91 624", date: "2026-09", trust: E}
    salary_range: {v: [70000, 102000], src: "hh.ru, сентябрь 2026: вакансии оператора WMS в Москве, от 70 000 до 102 000", date: "2026-09", trust: E}

  - id: shift_supervisor
    name: Начальник смены
    what: Руководит сменой, распределяет людей и отвечает за показатели
    group: support
    salary_month: {v: 124000, src: "Обзор рынка труда IBC Real Estate и ОЭЗ «Максимиха», август 2026, дает 124 000 по начальникам склада. Начальник смены это ступень ниже, поэтому цифра скорее завышена, точного источника не нашли", date: "2026-09", trust: E}

  - id: mechanic
    name: Механик складской техники
    what: Обслуживает и чинит погрузчики, тележки и конвейеры
    group: support
    salary_month: {v: 136000, src: "Агрегатор вакансий, 2026: механик по обслуживанию и ремонту в Москве 135 991. В эту выборку попадают автомеханики, поэтому для склада цифра скорее завышена", date: "2026-09", trust: E}

  - id: robot_operator
    name: Оператор роботов
    what: Дежурит в робозоне, разбирает сбои и следит за парком
    group: robots
    salary_from: replaced_role
    hire_from_market: false
    salary_note: >-
      Своей ставки у этой роли нет, и мы ее не нашли: вакансий оператора складских роботов
      с указанной зарплатой в открытом доступе нет. Ближайшее это оператор робототехнического
      комплекса на сварке, 130 000-160 000 в Москве, но это другая профессия.
      Поэтому оператора берем только из переученных: оклад прежней роли плюс надбавка
      facilities.<объект>.operator_salary_premium. Нанимать с рынка модель не умеет,
      выдумывать ставку мы не будем. Если высвобожденных на операторов не хватает,
      расчет говорит об этом отдельной строкой, а не подставляет цифру.

  - id: robot_engineer
    name: Сервисный инженер по роботам
    what: Чинит роботов, меняет узлы и батареи, настраивает систему управления
    group: robots
    salary_month: {v: 172000, src: "hh.ru, сентябрь 2026: 4 вакансии сервисного инженера по роботам в Москве, 138 000-207 000 gross, взяли середину", date: "2026-09", trust: C}
    salary_range: {v: [138000, 207000], src: "hh.ru, сентябрь 2026: 4 вакансии сервисного инженера по роботам в Москве", date: "2026-09", trust: C}
    salary_note: >-
      По умолчанию обслуживание роботов входит в OPEX отдельной строкой (maintenance_share_year),
      и тогда эту роль в штат не добавляем, иначе заплатим за сервис дважды. Роль нужна,
      когда клиент хочет держать своего инженера вместо сервисного контракта.
