# Модель медучреждения: корпус по этажам, лифты, двери, доставка из аптеки и уборка коридоров.
#
# Формат тот же, что у склада (config/model.yaml): {v: <число>, src: "<откуда>", date: "<ГГГГ-ММ>", trust: <оценка>}.
# Оценка по общей шкале проекта (docs/data-sources.md): S норматив, A производитель и проверка,
# B два типа источников, C один источник, D только организатор или только СМИ, E источники
# расходятся, F источника нет, это наше допущение (тогда в src написано почему такое значение).
# Число без источника вне meta и engine не пройдет тест (tests/clinic/test_sources.py).
#
# Объемы заявок, доля срочных, время комплектации и число точек доставки здесь не повторяем:
# они в датасете организатора data/facilities/clinic.csv со своими источниками, и шаг параметров
# правит их так же, как у склада. Характеристики роботов тоже не здесь: они в каталоге
# (data/facilities/solutions.csv и data/specs/specs.csv) со своими оценками S-F.

meta:
  version: 0.1

engine:
  seeds: [42, 7, 2026]  # поиск парка: парк подтверждаем на каждом, как у склада
  max_fleet: 30  # до какого парка ищем; размеры корпуса в запросе ограничивает app/schemas/clinic.py
  # Поиск парка дольше не идет. Прогон на сутки (24 ч, 385 заявок) для "Больничного корпуса" ищет парк
  # около 7-8 с на свободной машине и дольше под нагрузкой (на 12 параллельных запросах 8 с не хватало
  # и парк оставался неподтвержденным). 20 с дают запас в 2,5 раза, ответ укладывается в 30 с:
  # nginx ждет бэкенд до 180 с (frontend/nginx.conf), на фронте таймаута запроса нет.
  search_budget_s: 20

building:
  floor_height_m: {v: 3.3, src: "СП 158.13330.2014, табл. 6.3: высота палат и лечебных помещений не менее 3,0 м от пола до потолка. Толщину перекрытия с полом 0,3 м норма не задает, это допущение команды", trust: F}
  corridor_width_m: {v: 2.4, src: "СП 158.13330.2014, приложение Б, табл. Б.1, строка 6: коридоры палатных отделений 2,4 м. В отраслевом датасете тоже 2,4 (лист \"Медучреждение\")", date: "2026-10", trust: S}
  ward_door_mm: {v: 1200, src: "СП 158.13330.2014, табл. 6.1: палаты, палаты интенсивной терапии, операционные, куда возят больного на кровати, проем не менее 1,2 м", date: "2026-10", trust: S}
  office_door_mm: {v: 900, src: "СП 158.13330.2014, табл. 6.1: кабинеты врачей и помещения, доступные для людей на креслах-колясках, проем не менее 0,9 м", date: "2026-10", trust: S}
  lab_door_mm: {v: 1000, src: "СП 158.13330.2014, табл. 6.1: лаборантские, проем не менее 1,0 м", date: "2026-10", trust: S}

# Лифт: одна кабина на шахту. Кабина едет к этажу вызова, открывает двери, роботы въезжают,
# двери закрываются, кабина едет, открывает, роботы выезжают. Время поездки считаем по скорости
# и ускорению, а не "секунд на этаж": два этажа это не две поездки на один.
lift:
  speed_m_s: {v: 1.0, src: "TK Elevator, таблица размеров шахт для лифтов от 1600 кг (digital.brochure.tkelevator.com): лифт 2000 кг, кабина 1500 x 2700 мм под кровать, двери 1200 мм, скорость 1,0 м/с. Больничные лифты обычно на этой скорости, есть и 1,6", date: "2026-10", trust: C}
  acceleration_m_s2: {v: 0.8, src: "Peters Research, Lift Performance Time: замер лифта, ускорение по подгонке 0,81 м/с2 (максимум 0,95). Один замер, берем округленно", date: "2026-10", trust: C}
  door_open_s: {v: 3, src: "Спецификация обслуживания лифтов округа Саммит, Огайо (council.summitoh.net, 2023): открытие и закрытие дверей 2-3,5 с в зависимости от привода; правила ADA: двери открыты не меньше 3 с. Берем 3", date: "2026-10", trust: C}
  door_close_s: {v: 3, src: "Спецификация обслуживания лифтов округа Саммит, Огайо (council.summitoh.net, 2023): 2-3,5 с. Проверка: у Peters Research от начала закрытия дверей до открытия на соседнем этаже 3,5-4 м меньше 9 с, у нас 3 + 6 = 9 с", date: "2026-10", trust: C}
  board_s: {v: 10, src: "Нет источника: сколько робот въезжает в кабину и встает, и столько же выезжает. Два метра на малой скорости 0,3-0,5 м/с это 4-7 с, плюс разворот. Замеры поездок есть в исследовании Digital Health 2026 (122 рейса робота с лекарствами), но в открытой части статьи цифр нет", trust: F}
  cabin_w_mm: {v: 1500, src: "TK Elevator: лифт 2000 кг под кровать, кабина 1500 x 2700 мм (таблица размеров шахт). Значение типового корпуса, у своего корпуса берите паспорт лифта", date: "2026-10", trust: C}
  cabin_d_mm: {v: 2700, src: "TK Elevator: лифт 2000 кг, кабина 1500 x 2700 мм", date: "2026-10", trust: C}
  door_mm: {v: 1200, src: "TK Elevator: лифт 2000 кг, кабина 1500 x 2700 мм, телескопические двери 1200 мм", date: "2026-10", trust: C}
  robots_per_ride: {v: 2, src: "Нет источника: сколько роботов производители пускают в одну кабину. По габаритам в кабину 1500 x 2700 встает 6 роботов размером с Pudu FlashBot, но им нужно разъехаться при выходе. Берем двух, допущение", trust: F}
  people_calls_per_hour: {v: 12, src: "Нет источника: сколько раз в час лифт занимают люди. Лифт общий с персоналом и посетителями; в исследовании Digital Health 2026 загрузка лифта людьми главная причина задержек и сбоев роботов, но числа в открытой части нет. Раз в пять минут, допущение команды", trust: F}

# Двери на пути: автоматическую робот открывает сам и ждет, пока она откроется. Ручную он
# открыть не может: ждет, пока откроет человек. Ширину проема сравниваем с проходом робота из каталога.
doors:
  auto_open_s: {v: 5, src: "Проверочный лист автоматической распашной двери, Lancashire County Council: время открытия 5 с; по EN 16005 распашная дверь открывается до 80 градусов не быстрее чем за 3 с (Manusa, разбор EN 16005)", date: "2026-10", trust: D}
  manual_wait_s: {v: 30, src: "Нет источника: сколько робот ждет у ручной двери, пока ее откроет человек. Если рядом пост, это секунды, ночью может быть дольше. Берем полминуты, допущение", trust: F}

# Доставка из аптеки и склада расходников в отделения.
delivery:
  speed_share: {v: 0.67, src: "То же правило, что у склада: средняя скорость 2/3 максимальной (у Ronavi H1500 1 м/с при максимуме 1,5, разбор цикла Ronavi 24.04.2025; у RoboCV рядом с людьми 1,5 из 2 м/с). В коридорах больницы скорость рядом с людьми и так снижают", date: "2026-10", trust: D}
  load_s: {v: 60, src: "Нет источника: фармацевт кладет заказ в отсек и закрывает его. Отсеки Pudu FlashBot Max открываются по паролю или NFC (производитель), сколько это занимает, не публикует никто", trust: F}
  handover_s: {v: 90, src: "Нет источника: робот приехал на пост, звонит, медсестра подходит, открывает отсек по паролю и забирает. Ожидание медсестры не публикуют. Полторы минуты, допущение", trust: F}
  supplies_pick_s: {v: 300, src: "Нет источника: сколько собирают одну доставку расходников на складе. Для лекарств датасет дает 12 минут на заявку, расходники это несколько коробок со склада, берем 5 минут", trust: F}
  routine_deadline_min: {v: 60, src: "Нет источника: норматива срока доставки плановой заявки из аптеки нет. Срок считаем от готовности заказа, комплектацию делает аптека. У пилота Moxi в среднем 25 минут от заявки до доставки (AONL Voice, 01.2022). Берем час: заявка на смену отделения, не срочная", trust: F}
  stat_deadline_min: {v: 20, src: "Нет источника: срок срочной (STAT) доставки. Датасет говорит только, что STAT это приоритет и робот прерывает плановый маршрут. Берем 20 минут от готовности заказа, вместе с комплектацией 12 минут по датасету это около получаса от заявки", trust: F}
  battery_reserve: {v: 0.2, src: "Нет источника: с какого остатка заряда робот едет на зарядку, обычно это настройка. Pudu и Keenon уходят на базу сами, порог не публикуют. Берем 20%", trust: F}
  robots_per_charger: {v: 1, src: "Нет источника: у роботов-доставщиков Pudu и Keenon зарядная станция в комплекте с роботом, поэтому место у каждого свое. Допущение, проверить в договоре поставки", trust: F}
  on_time_target: {v: 0.95, src: "Наша цель для подбора парка: 95% заявок вовремя, остальные с опозданием. Норматива нет, это наше допущение: порог, на который мы подбираем парк. Как и у склада, парк можно задать руками", trust: F}

# Как распределяются заявки по суткам: пики из датасета, доля в пиках наша.
demand:
  peak_share: {v: 0.67, src: "Отраслевой датасет называет пики 07:00-10:00 и 15:00-17:00 (лист \"Медучреждение\", logistics_peak_hours), но не говорит, какая доля заявок в них. Берем две трети, допущение: пять часов из 24 несут большую часть выдачи", trust: F}
  shift_start_h: {v: 7, src: "Окно начинается с утреннего пика в 7:00 (лист \"Медучреждение\", logistics_peak_hours); при окне 24 ч начало влияет только на порядок часов", date: "2026-10", trust: D}
  shift_hours: {v: 24, src: "Отраслевой датасет: стационар работает 24/7/365 (лист \"Медучреждение\", inpatient_schedule). Роботов покупают и обслуживают на весь год, поэтому прогон по умолчанию покрывает сутки: одна дневная смена давала эффект трети суток при полной цене парка. Поликлинике окно задается в процессах корпуса", date: "2026-10", trust: D}

# Уборка коридоров. Уборщики на лифте не ездят: в каталоге ни у одного нет интеграции с лифтом,
# поэтому уборщик закреплен за своим этажом и базой на нем.
cleaning:
  passes_per_day: {v: 2, src: "СП 2.1.3678-20, п. 4.25.1: влажная уборка помещений не реже двух раз в сутки", date: "2026-10", trust: S}
  passes_per_shift: {v: 2, src: "Проходов за окно прогона по умолчанию. Окно по умолчанию сутки, поэтому две уборки по СП 2.1.3678-20, п. 4.25.1. Для дневного окна 8 ч в процессах корпуса ставится один проход", date: "2026-10", trust: S}
  travel_speed_m_s: {v: 0.5, src: "Нет источника: скорость переезда уборщика до участка. У Клинботикс 400 PRO и 600 скорость не опубликована; берем 0,5 м/с, медленнее доставщика", trust: F}
  battery_reserve: {v: 0.15, src: "Нет источника: с какого остатка уборщик едет на базу. Берем 15%, допущение", trust: F}

# Эффект в часах персонала. В рубли их переводит раздел money ниже по цене часа санитара.
staff:
  min_aisle_width_mm: {v: 600, src: "Допущение: условный габарит человека с небольшой тележкой 600 мм в плане. Измерений на объекте нет; ручной маршрут строится отдельно от габаритов робота. Лифтовая интеграция робота не ограничивает доступ человека", trust: F}
  walk_speed_m_s: {v: 1.0, src: "Скорость человека с кроватью-каталкой 1,03-1,53 м/с по группам (arXiv 2006.02169, оценка горизонтального перемещения больничных кроватей). Санитар с тележкой не быстрее, берем нижнюю границу", date: "2026-10", trust: C}
  handover_s: {v: 60, src: "Нет источника: сколько санитар отдает заказ на посту. Медсестре не нужно идти к роботу и вводить пароль, поэтому меньше, чем у робота. Допущение", trust: F}
  lift_wait_s: {v: 45, src: "Нет источника: сколько человек ждет лифт. Берем половину цикла кабины между крайними этажами корпуса из четырех этажей, допущение", trust: F}

# Деньги: три сценария, как у склада (без роботов, покупка, аренда), но проще. Эффект это часы
# санитаров и уборщиц, которые забирают роботы, по цене рабочего часа. В деньги идут только целые
# высвобожденные ставки (whole_positions_released), остальное показываем стоимостью времени.
# Зарплата санитара, начисления, текучесть и горизонт в датасете (data/facilities/clinic.csv), цены
# роботов в каталоге (data/specs/sources.csv). Здесь только то, чего нет ни там, ни там.
money:
  loan_enabled: {v: 0, src: "Допущение интерфейса: кредит считается только после явного добавления пользователем, не выбирается автоматически ради снижения аванса", trust: F}
  loan_rate: {v: 0.20, src: "Нет предложения банка: сценарное допущение 20% годовых. Замените ставкой из своего договора, это не актуальная рыночная котировка", trust: F}
  loan_months: {v: 36, src: "Нет кредитного договора: сценарное допущение срока 36 месяцев, можно задать от 1 до 360. Долг за горизонтом погашается в конце расчета", trust: F}
  loan_own_share: {v: 0.20, src: "Нет кредитного договора: допущение 20% цены оборудования оплачивается своими деньгами. Внедрение и пусконаладка полностью оплачиваются на старте", trust: F}
  loan_insurance_share: {v: 0.01, src: "Нет страхового предложения: допущение 1% цены оборудования в год на срок кредита. Укажите условия договора или ноль при отсутствии страховки", trust: F}
  annual_work_hours: {v: 1972, src: "Производственный календарь 2026, 40-часовая неделя, consultant.ru/law/ref/calendar/proizvodstvennye/2026/ (то же в config/model.yaml)", date: "2026-09", trust: S}
  paid_leave_hours: {v: 160, src: "ТК РФ ст. 115: ежегодный оплачиваемый отпуск 28 календарных дней, это 20 рабочих дней по 8 ч. Ставку оплачивают весь год, а работает она 1 972 - 160 = 1 812 ч: час работы дороже, чем зарплата / 1 972. Больничные не учтены, эффект от этого занижен", date: "2026-10", trust: S}
  days_per_year: {v: 365, src: "Отраслевой датасет, лист \"Медучреждение\": стационар работает 24/7/365 (inpatient_schedule)", date: "2026-09", trust: D}
  shifts_counted: {v: 1, src: "Сколько раз в сутки повторяется окно прогона. Окно по умолчанию это сутки, поэтому 1: эффект и затраты относятся к одному и тому же времени работы парка. Непрогнанные часы не домножаем", date: "2026-10", trust: D}
  discount_rate: {v: 0.14, src: "Ключевая ставка ЦБ 14,00%, решение 11.09.2026, без премии за риск, как у склада (config/model.yaml). Заказчик задает свою ставку дисконтирования", date: "2026-09", trust: C}
  wage_growth: {v: 0.07, src: "Сценарные условия Минэкономразвития на 2027-2029, 12.05.2026: рост зарплат около 7% в год (то же в config/model.yaml)", date: "2026-09", trust: C}
  inflation: {v: 0.04, src: "Прогноз ЦБ 11.09.2026: 4,0% в 2027; МЭР: 4,0% в 2027-2029 (то же в config/model.yaml)", date: "2026-09", trust: C}
  cleaning_m2_per_hour: {v: 230, src: "Типовые нормы обслуживания для уборщиков: 0,26 минуты на квадратный метр влажной уборки, около 230 м2/ч (config/roles.yaml, роль cleaner). Норму именно для больничных коридоров не нашли", date: "2026-10", trust: D}
  whole_positions_released: {v: 1, src: "Допущение по умолчанию, пока заказчик не задал долю сам: бюджет сокращают только целые высвобожденные ставки каждой роли, дробный остаток остается стоимостью времени. Ставку снимают без увольнений, не замещая уходящих: текучесть немедицинского персонала 45% в год (лист \"Медучреждение\", staff_turnover_pct). Rochester Regional Health (27.03.2024) штат не сокращал, поэтому 0 ставок тоже возможный ответ: задайте долю 0%", date: "2026-10", trust: F}
  cleaning_time_saving_share: {v: 0.8, src: "Допущение: ручная база уборки это только мойка тех м2 коридора, которые робот вымыл в прогоне, поэтому поверхности, санузлы и палаты в нее и так не входят. За человеком остаются кромки, углы, места под каталками и разливы, берем 20%; подготовка и очистка робота считаются отдельно (cleaner_support_min_per_shift). Прежние 25% Barts Health (29.04.2026) это снижение всего времени уборки полов отделения, где коботы моют часть площадей; применять их к уже вымытой роботом площади значит учесть оставшийся труд дважды", date: "2026-10", trust: F}
  delivery_support_min_per_job: {v: 2, src: "Нет источника длительности: дополнительная помощь на заявку сверх загрузки и выдачи, сценарное допущение. ChristianaCare, doi:10.32481/djph.2024.12.05: 107 вмешательств в 89 наблюдавшихся доставках; длительность не дана", date: "2026-10", trust: F}
  cleaner_support_min_per_shift: {v: 15, src: "Нет измерений на объекте: допущение на подготовку, очистку и контроль одного уборщика за смену, дополнительно к оставшейся ручной уборке. Измените после хронометража", trust: F}
  manual_door_assist_s: {v: 10, src: "Нет источника: активная работа человека на одно открытие ручной двери; ожидание робота 30 с не равно занятости человека. Допущение для оценки трудозатрат, ресурс помощника не моделируется", trust: F}
  integration_rub: {v: 0, src: "Допущение без сметы: интеграция лифтов, СКУД, Wi-Fi и обучение не оценены. Ноль означает неизвестную стоимость; введите смету отдельно от пусконаладки робота", trust: F}
