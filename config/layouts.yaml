# Шаблоны планировки склада: из них строится план объекта на третьем шаге.
#
# Зачем они нужны. Движок считал объект как квадрат со стороной из корня площади, ворота
# посередине нижней стороны, задания в случайной точке. От такой геометрии длина маршрута
# зависит слабо, а она определяет производительность робота и размер парка. Шаблон дает
# настоящие пропорции здания, зоны, проезды и ворота, и план из него можно править руками.
#
# Каждое значение записано так же, как в config/model.yaml: {v, src, date, trust}.
# Оценки по общей шкале (docs/data-sources.md, «Оценка достоверности»).
#
# Важно про источники. Норматива на планировку склада нет. СП 57.13330 прямо говорит, что
# размеры пролетов и шаг колонн определяются технологией, а не правилами. Все, что ниже, это
# рыночная классификация складов и отраслевая практика, поэтому оценки тут D и C, а не S.

constants:
  column_grid_m:
    v: 12
    src: "Рыночная классификация складов: класс А, шаг колонн не менее 12 м. ibcrealestate.ru/blog/klassifikatsiya-skladskoy-nedvizhimosti-zachem-ona-nuzhna-i-kak-ustroena/, skladium.ru/rynok/sklad-a"
    date: "2026-09"
    trust: D
  span_m:
