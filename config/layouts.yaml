    src: "Там же: расстояние между пролетами не менее 24 м"
    date: "2026-09"
    trust: D
  area_per_dock_m2:
    v: 1000
    src: "Источники расходятся: одни ворота на 500 м2 (skladium.ru, moshol14.ru), одни на 800-1000 м2 (ibcrealestate.ru). Берем 1000: ворот меньше, очередь у ворот длиннее, окупаемость хуже"
    date: "2026-09"
    trust: E
  dock_pitch_m:
