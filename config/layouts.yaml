# Ворота делим между приемкой и отгрузкой поровну: как они распределены на конкретном объекте,
# мы не знаем, а перекос в любую сторону надо было бы чем-то обосновать.
#
# aspect это длинная сторона здания к короткой. Длинная сторона лежит вдоль оси x, то есть
# вдоль листа в редакторе: южная и северная стены длинные, западная и восточная короткие.

# Проходы под людей мы не сужаем. Робот проезжает и в 0,75 м, но пока в зоне работают люди
# и погрузчики, ширина проезда остается погрузчичьей. Узкие проходы есть только в робозоне,
# куда люди не заходят: это отдельный шаблон.

templates:
- id: through
  name: "Сквозной"
  about: "Приемка с одной длинной стены, отгрузка с противоположной, хранение между ними."
  fits: "Большой поток и разные машины на приход и отход: встречного движения нет."
  aspect: {v: 1.5, src: "Источника нет. Пропорция типового здания под сквозной поток: приемка и отгрузка на длинных стенах, поэтому здание вытянуто", trust: F}
  aisle: aisle_reach_truck_m
  racks: along_flow
  docks:
  - {wall: south, kind: receiving}
  - {wall: north, kind: shipping}
  buffers:
  - {wall: south, kind: receiving}
  - {wall: north, kind: shipping}
  chargers: {wall: west}

- id: corner
  name: "Г-образный"
  about: "Приемка и отгрузка на соседних стенах, поток поворачивает внутри здания."
  fits: "Здание с воротами на две стороны и разведенные приход с отходом."
  aspect: {v: 1.2, src: "Источника нет. Г-образный поток разворачивается внутри, поэтому здание ближе к квадрату", trust: F}
  aisle: aisle_reach_truck_m
  racks: along_flow
  docks:
  - {wall: south, kind: receiving}
  - {wall: east, kind: shipping}
  buffers:
  - {wall: south, kind: receiving}
  - {wall: east, kind: shipping}
  chargers: {wall: west}

- id: one_side
  name: "С одной стороны"
  about: "Приемка и отгрузка на одной стене, общая доковая зона, поток разворачивается буквой П."
  fits: "Арендованный блок с воротами на одну сторону: так устроено большинство складов класса А."
  aspect: {v: 1.4, src: "Источника нет. Арендованный блок класса А: ворота на короткой стене, здание вытянуто вглубь", trust: F}
  aisle: aisle_forklift_m
  racks: across_flow
  docks:
  - {wall: west, kind: receiving}
  - {wall: west, kind: shipping}
  buffers:
  - {wall: west, kind: both}
  chargers: {wall: east}

- id: robot_zone
  name: "Робозона, товар к человеку"
  about: "Плотная сетка мобильных стеллажей без людей внутри, станции комплектации вдоль стены."
  fits: "Штучный отбор: робот везет стеллаж к человеку, а не человек идет к стеллажу."
  aspect: {v: 1.0, src: "Источника нет. Робозона режется на квадрат: при равных сторонах средний путь стеллажа к станции короче", trust: F}
  aisle: aisle_robot_zone_m
  racks: grid
  rack_type: pods
  docks:
  - {wall: south, kind: both}
  buffers:
  - {wall: south, kind: both}
  stations: {wall: north}
  chargers: {wall: west}

# Типы стеллажей. Тип подставляет в зону хранения толщину ряда, проезд, длину ряда до
# поперечного проезда и шаг яруса, а человек эти числа правит в окне зоны. Строка вместо
# числа это ссылка на константу выше: проезд погрузчика или главный проезд у типов общие.
#
# row_m это толщина одного ряда поперек проезда, block_rows сколько рядов стоят вплотную
# до следующего проезда. robot_inside говорит, заезжает ли робот в блок: в набивной и мобильный
# стеллаж он берет груз только с торца или из одного открытого прохода, и такие решения мы
# переводим в «требует проверки». people: false значит, что людей в зоне нет и проезд можно
# сузить под робота.

rack_types:
- id: front
  name: "Фронтальный"
  about: "Доступ к каждой паллете из проезда. Два ряда стоят спиной к спине."
  robot_inside: true
  people: true
  row_m: rack_row_double_m
  block_rows: {v: 1, src: "У фронтального стеллажа к каждой паллете свой проезд: между проездами один двойной ряд. metech.ru/blog/info/frontalnye-palletnye-stellazhi/", date: "2026-09", trust: C}
  aisle_m: aisle_reach_truck_m
  run_m: block_run_m
  cross_m: aisle_main_m
  tier_m: pallet_tier_m

- id: drive_in
  name: "Набивной"
  about: "Сплошной блок каналов, погрузчик заезжает внутрь с торца. Последним пришел, первым ушел."
  robot_inside: false
  people: true
  row_m: {v: 13.5, src: "Канал на 11 паллет в глубину (mecalux.com/warehouse-racking-and-shelving/drive-in-racking), на каждую паллету 1,2 м и еще 25 мм. Обычно при доступе с одной стороны 10-15 паллет: comitas.ru/articles/glubinnye-stellazhi-maksimalnaya-plotnost-khraneniya-na-sklade/", date: "2026-09", trust: D}
  block_rows: {v: 1, src: "Блок набивного стеллажа сплошной: каналы внутри него, проездов между рядами нет. metech.ru/blog/info/nabivnye-stellazhi-tipa-drive-in/", date: "2026-09", trust: C}
  aisle_m: aisle_forklift_m
  run_m: block_run_m
  cross_m: aisle_main_m
  tier_m: pallet_tier_m

- id: mobile
  name: "Мобильный"
  about: "Ряды на подвижных основаниях сдвигаются, в блоке открыт один проход."
  robot_inside: false
  people: true
  row_m: rack_row_double_m
  block_rows: {v: 7, src: "Склад Nufri: 38 оснований в трех блоках, самый маленький блок 7 оснований, в каждом блоке открыт один проход. mecalux.com/case-studies/example-mobile-pallet-racking-movirack-nufri-spain. Это пример одного склада, типового числа нет", date: "2026-09", trust: D}
  aisle_m: aisle_forklift_m
  run_m: block_run_m
  cross_m: aisle_main_m
  tier_m: pallet_tier_m

- id: shelf
  name: "Полочный"
  about: "Низкие полки для штучного отбора руками. Человек с тележкой или небольшой робот."
  robot_inside: true
  people: true
  row_m: {v: 1.0, src: "Две полки спиной к спине по 0,5 м: типовая глубина полки 400-600 мм. uralsklad.com/polochnye-stellazhi", date: "2026-09", trust: C}
  block_rows: {v: 1, src: "Полочные стеллажи ставят рядами с проходом к каждому. stellmart.ru/normy-i-klassifikatsii/rasstoyanie-mezhdu-skladskimi-stellazhami/", date: "2026-09", trust: D}
  aisle_m: {v: 1.2, src: "Проход между полочными стеллажами 1,2 м, при ручном отборе не меньше 1,0 м. stellmart.ru/normy-i-klassifikatsii/rasstoyanie-mezhdu-skladskimi-stellazhami/", date: "2026-09", trust: D}
  run_m: block_run_m
  cross_m: aisle_main_m
  tier_m: {v: 0.45, src: "Шага полки не нашли. Берем типовую высоту стеллажа 2,2 м (каталоги продавцов, uralsklad.com/polochnye-stellazhi) на пять полок", trust: F}

- id: pods
  name: "Стеллажи для робота"
  about: "Робот подъезжает под стеллаж и везет его к станции. Людей в зоне нет."
  robot_inside: true
  people: false
  row_m: {v: 1.0, src: "Основание стеллажа Kiva 1 на 1 м: allaboutlean.com/amazon-kiva-storage-strategies/. У Geek+ P500R груз 880-1020 мм: vertiflex.eu/our-solutions/robots/robotics-shelf-to-person-solution", date: "2026-09", trust: D}
  block_rows: {v: 3, src: "Стеллажи Kiva ставят блоками 3 на 6, 3 на 7, 4 на 6 и 4 на 7, между блоками проезды. allaboutlean.com/amazon-kiva-storage-strategies/", date: "2026-09", trust: D}
  aisle_m: aisle_robot_zone_m
  run_m: {v: 6, src: "Там же: блок в длину 6-7 стеллажей по 1 м", date: "2026-09", trust: D}
  cross_m: aisle_robot_zone_m
  tier_m: {v: 2.4, src: "Высота стеллажа Kiva 1,8-2,4 м (allaboutlean.com/amazon-kiva-storage-strategies/). Ярус один: робот везет стеллаж целиком и ничего не поднимает", date: "2026-09", trust: D}
  tiers: {v: 1, src: "Робот поднимает стеллаж над полом и везет целиком: ярусов подъема нет, до верхней полки достает человек на станции. geekplus.com/technology-detail-page/p-series", date: "2026-09", trust: D}
