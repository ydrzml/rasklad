    src: "Отраслевой разбор доковых зон: минимальный шаг фур 3,6 м, практические варианты 4 м и 8 м. newsklad.ru/news.php?news_id=1407, sitmag.ru/article/23019"
    date: "2026-09"
    trust: D
  dock_zone_depth_m:
