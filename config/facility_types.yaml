# Типы объектов для первого шага. Это витрина выбора, а не расчетная модель:
# считать умеем только те объекты, которые заведены в config/model.yaml.
#
# status:
#   ready         объект есть в расчетной модели, проходится весь путь
#   solutions     объекта в модели нет, но есть параметры из датасета и разобранный список
#                 решений (data/facilities): путь идет до списка решений и там честно кончается
#   catalog_only  объекта в модели нет, показываем счет решений и говорим об этом прямо
#
# scenarios: наш тег над каталогом организатора. Колонки «тип объекта» в каталоге нет,
# есть «Отрасль» (9 значений) и «Сценарий» (98), и одно решение годится нескольким типам
# объектов сразу. Подробнее в docs/decisions.md, раздел
# «Тип объекта это наш тег над каталогом, в данных его нет».
# Названия сценариев повторяют каталог дословно, вместе с опечатками организатора.
#
# catalog.count: сколько позиций каталога попадает в эти сценарии. У склада числа нет:
# оно считается по каталогу в базе (решения с подтвержденной задачей склада), у аэропорта
# и медучреждения по разобранному списку data/facilities/solutions.csv. У «другого»
# считать не из чего, выгрузки организатора в репозитории нет, поэтому число
# посчитано один раз и записано вместе с правилом подсчета.
# next: что мы делаем дальше у объекта без расчета, строками. Экран показывает их под списком
# решений в блоке "Что дальше". Новой логики за ними нет, это план развития (docs/documentation.md, 6.9).
# catalog.note: что именно значит это число. На карточке оно стоит рядом с числом,
# чтобы одинаковые на вид цифры не выдавали проработанный склад и непроработанный аэропорт
# за одно и то же.

facility_types:
- id: warehouse
  name: "Склад"
  status: ready
  note: "Подбор решений, смена на плане и экономика трех сценариев"
  scenarios:
  - "Внутрискладская логистика"
  - "Внутрипроизводственная логистика"
  - "Сортировка грузов"
  - "Инвентаризация склада"
  - "Уборка помещений"
  catalog:
    note: "Решения каталога, подтвержденные для склада, характеристики с источниками и оценкой"

- id: airport
  name: "Аэропорт"
  status: solutions
  note: "Параметры из датасета и решения с объяснением, без плана и экономики"
  next:
  - "Задачи с расчетом: перевозка багажа по перрону и уборка терминала."
  - "План из двух частей: терминал и перрон, открытая площадка с большими расстояниями и морозом."
  - "Маршрут тягача от сортировки к стоянке самолета и обратно."
  - "Спрос идет волнами по рейсам: кривую по часам строим из суток и пикового часа датасета, это допущение с оценкой F."
  scenarios:
  - "Внутрискладская логистика"
  - "Перевозка грузов на закрытых площадках"
  - "Перемещение грузов"
  - "Уборка помещений"
  - "Патрулирование территории"
  catalog:
    note: "Решения каталога и открытых источников, разобраны под задачи аэропорта"

- id: clinic
  name: "Медучреждение"
  status: solutions
  note: "Параметры из датасета и решения с объяснением, без плана и экономики"
  next:
  - "Задачи с расчетом: доставка по этажам, лекарства и расходники из аптеки в отделения, и уборка коридоров."
  - "План корпуса по этажам: этаж это такой же план, как у склада, только выше по высоте, между этажами переключатель."
  - "Этажи связывает лифт. В прогоне смены он очередь, как зарядка: в кабину входит несколько роботов, лифт может быть общим с людьми."
  - "Эффект считаем как высвобожденные часы персонала по цене часа, а не как сокращение ставок."
  scenarios:
  - "Уборка помещений"
  - "Доставка биоматериаловм"
  - "Администрирование торгового зала"
  - "Внутрискладская логистика"
  catalog:
    note: "Решения каталога и открытых источников, разобраны под задачи больницы"

- id: other
  name: "Другое"
  status: catalog_only
  note: "Своего расчета нет: можно посмотреть, что вообще есть в каталоге"
  scenarios: []
  catalog:
    count: {v: 194, src: "Каталог роботизированных решений ФЦ БАС: 223 позиции минус 28 в статусе «разработка» и одна программа без оборудования", date: "2026-09", trust: D}
    note: "Весь каталог решений ФЦ БАС, кроме того, что нельзя купить"
