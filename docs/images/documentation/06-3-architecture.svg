<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face { font-family: "Onest"; src: url("../../../backend/app/reports/fonts/Onest-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Onest"; src: url("../../../backend/app/reports/fonts/Onest-SemiBold.ttf"); font-weight: 600; }
      .title { font-family: "Onest", sans-serif; font-weight: 600; font-size: 19px; fill: #0d141b; }
      .tag { font-family: "Onest", sans-serif; font-weight: 600; font-size: 12px; fill: #0b4fa8; letter-spacing: 0.5px; }
      .item { font-family: "Onest", sans-serif; font-weight: 400; font-size: 14px; fill: #0d141b; }
      .sub { font-family: "Onest", sans-serif; font-weight: 400; font-size: 12.5px; fill: #55636f; }
      .row { font-family: "Onest", sans-serif; font-weight: 600; font-size: 14px; fill: #0b4fa8; }
      .frame { font-family: "Onest", sans-serif; font-weight: 400; font-size: 12.5px; fill: #55636f; }
    </style>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f8fe"/><stop offset="1" stop-color="#e3eefb"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fc"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6e6f9"/><stop offset="0.5" stop-color="#eaf2fc"/><stop offset="1" stop-color="#c9ddf5"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b4fa8" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b4fa8"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <rect x="226" y="22" width="756" height="438" rx="18" fill="none" stroke="#9db8dc" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="246" y="46" class="frame">docker compose: три контейнера, запуск одной командой</text>
  <g filter="url(#shadow)"><rect x="18" y="120" width="180" height="250" rx="14" fill="url(#card)" stroke="#bcd3ee" stroke-width="1.5"/></g>
  <text x="38" y="150" class="tag">REACT</text>
  <text x="38" y="176" class="title">Браузер</text>
  <text x="38" y="210" class="item">мастер из 5 шагов</text>
  <text x="38" y="236" class="item">чертеж плана</text>
  <text x="38" y="262" class="item">смена на плане</text>
  <text x="38" y="288" class="item">кабинет</text>
  <text x="38" y="314" class="item">админка</text>
  <g filter="url(#shadow)"><rect x="250" y="170" width="160" height="150" rx="14" fill="url(#card)" stroke="#bcd3ee" stroke-width="1.5"/></g>
  <text x="270" y="200" class="tag">NGINX</text>
  <text x="270" y="226" class="title">Вход</text>
  <text x="270" y="256" class="sub">отдает интерфейс</text>
  <text x="270" y="276" class="sub">/api передает серверу</text>
  <text x="270" y="296" class="sub">ограничивает частоту</text>
  <g filter="url(#shadow)"><rect x="450" y="66" width="270" height="372" rx="16" fill="url(#core)" stroke="#0b4fa8" stroke-width="2"/></g>
  <text x="472" y="96" class="tag">PYTHON 3.12 · FASTAPI</text>
  <text x="472" y="122" class="title">Сервер</text>
  <line x1="472" y1="138" x2="698" y2="138" stroke="#d3e1f2"/>
  <text x="472" y="162" class="row">api</text>
  <text x="510" y="162" class="sub">запросы, описание OpenAPI</text>
  <line x1="472" y1="176" x2="698" y2="176" stroke="#d3e1f2"/>
  <text x="472" y="200" class="row">services</text>
  <text x="546" y="200" class="sub">сценарии, проекты</text>
  <line x1="472" y1="214" x2="698" y2="214" stroke="#d3e1f2"/>
  <rect x="464" y="222" width="242" height="104" rx="10" fill="#0b4fa8"/>
  <text x="480" y="248" class="row" style="fill:#ffffff">engine</text>
  <text x="480" y="272" class="item" style="fill:#ffffff">подбор с баллом</text>
  <text x="480" y="294" class="item" style="fill:#ffffff">прогон смены на SimPy</text>
  <text x="480" y="316" class="item" style="fill:#ffffff">экономика трех сценариев</text>
  <text x="472" y="354" class="row">reports</text>
  <text x="540" y="354" class="sub">PDF и Excel</text>
  <line x1="472" y1="368" x2="698" y2="368" stroke="#d3e1f2"/>
  <text x="472" y="392" class="row">config</text>
  <text x="532" y="392" class="sub">нормативы с источником</text>
  <text x="532" y="410" class="sub">и оценкой S-F</text>
  <g filter="url(#shadow)"><path d="M770,118 a85,22 0 0,1 170,0 v150 a85,22 0 0,1 -170,0 z" fill="url(#db)" stroke="#9db8dc" stroke-width="1.5"/></g>
  <ellipse cx="855" cy="118" rx="85" ry="22" fill="#f3f8fe" stroke="#9db8dc" stroke-width="1.5"/>
  <text x="855" y="176" text-anchor="middle" class="tag">POSTGRESQL 16</text>
  <text x="855" y="202" text-anchor="middle" class="title">База</text>
  <text x="855" y="230" text-anchor="middle" class="sub">каталог, пользователи</text>
  <text x="855" y="250" text-anchor="middle" class="sub">проекты и версии</text>
  <text x="855" y="270" text-anchor="middle" class="sub">журнал правок</text>
  <g filter="url(#shadow)"><rect x="770" y="330" width="170" height="92" rx="14" fill="url(#card)" stroke="#bcd3ee" stroke-width="1.5"/></g>
  <text x="855" y="362" text-anchor="middle" class="title" style="font-size:17px">Файлы</text>
  <text x="855" y="386" text-anchor="middle" class="sub">файлы проектов</text>
  <text x="855" y="404" text-anchor="middle" class="sub">фото каталога</text>
  <line x1="200" y1="245" x2="244" y2="245" stroke="#0b4fa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="412" y1="245" x2="444" y2="245" stroke="#0b4fa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="726" y1="200" x2="764" y2="200" stroke="#0b4fa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="726" y1="376" x2="764" y2="376" stroke="#0b4fa8" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
