services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unicorn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicorn}
      POSTGRES_DB: ${POSTGRES_DB:-unicorn}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unicorn}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unicorn}:${POSTGRES_PASSWORD:-unicorn}@db:5432/${POSTGRES_DB:-unicorn}
      # Пустой ключ: сервер придумает случайный сам. На сервере лучше задать свой в .env
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo12345}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin12345}
      # Почта для "Забыли пароль", пусто - ссылка в служебной таблице админки
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SITE_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
    depends_on:
      db:
        condition: service_healthy
    # Сервер открыт только на этом компьютере: снаружи все запросы идут через nginx с его защитой
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  db-data:
