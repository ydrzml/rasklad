# За nginx на стенде стоит Caddy с https: он передает, что запрос пришел по https, и мы это
# сохраняем. Без Caddy берем схему самого запроса
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Откуда странице можно брать скрипты, стили, шрифты и картинки: только с нашего сайта, шрифты с Google Fonts.
# Даже если кто-то сумеет вставить скрипт в страницу, браузер его не выполнит и данные никуда не отправит.
# Описание API и служебные таблицы админки берут оформление с чужих адресов, им оставляем только запрет встраивания
map $uri $content_security_policy {
    ~^/api/(docs|redoc|db) "frame-ancestors 'none'";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Адрес посетителя. На стенде перед nginx стоит Caddy во внутренней сети Docker и передает настоящий адрес.
# Снаружи nginx на стенде не виден, поэтому подделать этот заголовок посетитель не может
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Сколько запросов в минуту с одного адреса. Вход и смена пароля: подбор паролей по многим почтам сразу
# и нагрузка от хеширования. Прогон смены, отчеты и чувствительность: каждый считается секунду-три, поток таких запросов
# занял бы весь сервер. Обычному человеку хватает с запасом
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=heavy:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Не называем версию nginx в ответах
    server_tokens off;

    # Сжатие текста: основной скрипт 290 КБ и стили 100 КБ уходят в 3-4 раза меньше.
    # Картинки и шрифты уже сжаты, их не трогаем
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # Файлы в проекты грузим до 10 МБ, по умолчанию nginx пропускает только 1 МБ
    client_max_body_size 11m;
    # Расчет несет план с рядами, это 20-40 КБ: держим тело в памяти, а не во временном файле
    client_body_buffer_size 128k;
    # Первый расчет с прогоном смены на большом плане и трех решениях идет дольше минуты, а 60 с
    # по умолчанию обрывали его ответом 504. Повторные расчеты берут парк из памяти за доли секунды
    proxy_read_timeout 180s;

    # Браузер не угадывает тип файла, наш сайт нельзя встроить в чужую страницу,
    # адрес страницы не уходит на другие сайты
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $content_security_policy always;
    add_header Referrer-Policy "same-origin" always;

    # С портом: иначе служебные таблицы админки ищут свои стили на localhost:80
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Ответ на превышение тем же видом, что у сервера: экран покажет понятную строку
    error_page 429 = @too_many;
    location @too_many {
        default_type "application/json; charset=utf-8";
        return 429 '{"detail":"Слишком много запросов подряд, подождите минуту и попробуйте еще раз"}';
    }

    location ~ ^/api/auth/(login|register|me/password|me/email)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend:8000;
    }

    # Полная чувствительность пересчитывает расчет десятки раз, генерация большого плана идет секунды.
    # Замер плана сюда не входит: редактор зовет его после каждой правки
    location ~ ^/api/((simulation|reports)/|calculations/sensitivity|plan/generate) {
        limit_req zone=heavy burst=20 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Файлы сборки с хешем в имени не меняются: новая сборка дает новые имена. Браузер держит их год.
    # expires, а не add_header: add_header внутри location отменил бы заголовки безопасности сервера
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Страницу приложения браузер каждый раз сверяет: в ней ссылки на свежие файлы сборки
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
